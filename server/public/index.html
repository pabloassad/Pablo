<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CONVERT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #000000;
        --surface: #0b0f0b;
        --line: #14251a;
        --green: #38ff9b;
        --green-dim: #1f7a52;
        --red: #ff5c5c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        background: var(--bg);
        color: var(--green);
        font-family: "VT323", ui-monospace, monospace;
        overflow: auto;
      }

      /* Scanline + vignette overlay — never intercepts clicks */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        background: repeating-linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 0px,
            rgba(0, 0, 0, 0) 2px,
            rgba(0, 0, 0, 0.28) 3px,
            rgba(0, 0, 0, 0.28) 4px
          ),
          radial-gradient(circle at center, transparent 55%, rgba(0, 0, 0, 0.75) 100%);
      }

      form {
        width: 100%;
        max-width: 34rem;
        display: flex;
        flex-direction: column;
        gap: 1.75rem;
      }

      h1 {
        font-family: "Press Start 2P", monospace;
        font-size: clamp(1.1rem, 4.5vw, 1.6rem);
        line-height: 1.4;
        text-shadow: 0 0 8px rgba(56, 255, 155, 0.55);
        margin: 0;
        font-weight: 400;
      }

      .caret {
        display: inline-block;
        width: 0.6em;
        height: 1em;
        margin-left: 0.15em;
        background: var(--green);
        vertical-align: text-bottom;
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      input {
        width: 100%;
        padding: 0.85rem 1rem;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--green);
        font-family: "VT323", monospace;
        font-size: 1.25rem;
        letter-spacing: 0.02em;
        outline: none;
        border-radius: 0;
        transition: border-color 0.08s linear, box-shadow 0.08s linear;
      }

      input::placeholder {
        color: var(--green-dim);
      }

      input:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 1px var(--green), 0 0 14px rgba(56, 255, 155, 0.25);
      }

      input:disabled {
        opacity: 0.5;
      }

      .formats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }

      .format {
        padding: 0.7rem 0.5rem;
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--green-dim);
        font-family: "Press Start 2P", monospace;
        font-size: 0.65rem;
        cursor: pointer;
      }

      .format:hover:not(:disabled) {
        border-color: var(--green);
        color: var(--green);
      }

      .format[aria-pressed="true"] {
        border-color: var(--green);
        color: #000;
        background: var(--green);
      }

      .format:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .submit {
        padding: 0.95rem 1rem;
        background: transparent;
        border: 1px solid var(--green);
        color: var(--green);
        font-family: "Press Start 2P", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        cursor: pointer;
      }

      .submit:hover:not(:disabled) {
        background: var(--green);
        color: #000;
        box-shadow: 0 0 18px rgba(56, 255, 155, 0.45);
      }

      .submit:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .progress {
        width: 100%;
        height: 6px;
        background: var(--line);
        overflow: hidden;
      }

      .progress > span {
        display: block;
        height: 100%;
        width: 35%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(56, 255, 155, 0.8);
        animation: scan 1.1s ease-in-out infinite;
      }

      @keyframes scan {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      .status {
        min-height: 1.5rem;
        font-size: 1.15rem;
        letter-spacing: 0.03em;
      }

      .status[data-kind="error"] {
        color: var(--red);
        text-shadow: 0 0 8px rgba(255, 92, 92, 0.5);
      }

      .retry {
        align-self: flex-start;
        background: none;
        border: none;
        padding: 0;
        color: var(--red);
        font-family: "VT323", monospace;
        font-size: 1.1rem;
        text-decoration: underline;
        cursor: pointer;
      }

      .hidden {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        .caret,
        .progress > span {
          animation: none;
        }
        .progress > span {
          width: 100%;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>CONVERT<span class="caret" aria-hidden="true"></span></h1>

      <div class="field">
        <input
          id="url"
          type="url"
          inputmode="url"
          autocomplete="off"
          spellcheck="false"
          placeholder="> coller une URL"
          aria-label="URL"
        />

        <div class="formats" role="group" aria-label="Format">
          <button type="button" class="format" data-format="wav" aria-pressed="true">WAV</button>
          <button type="button" class="format" data-format="mp3" aria-pressed="false">MP3</button>
          <button type="button" class="format" data-format="flac" aria-pressed="false">FLAC</button>
        </div>
      </div>

      <button type="submit" class="submit" id="submit" disabled>CONVERTIR</button>

      <div class="progress hidden" id="progress" aria-hidden="true"><span></span></div>

      <div class="status" id="status" role="status" aria-live="polite" data-kind="info"></div>

      <button type="button" class="retry hidden" id="retry">réinitialiser</button>
    </form>

    <script>
      // The API lives on this same origin, so there is no cross-origin call and
      // nothing to configure — the page and the service ship together.
      const URL_RE =
        /^https?:\/\/(www\.|music\.|m\.)?(youtube\.com\/(watch\?|shorts\/|live\/)|youtu\.be\/)\S+$/i;

      const ERRORS = {
        invalid_url: "URL NON RECONNUE",
        invalid_format: "FORMAT INVALIDE",
        unavailable: "VIDÉO INDISPONIBLE",
        timeout: "DÉLAI DÉPASSÉ",
        convert_failed: "ÉCHEC DE CONVERSION",
        network: "SERVEUR INJOIGNABLE",
      };

      const form = document.getElementById("form");
      const urlInput = document.getElementById("url");
      const submit = document.getElementById("submit");
      const progress = document.getElementById("progress");
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      const formatButtons = [...document.querySelectorAll(".format")];

      let format = "wav";
      let busy = false;

      function setBusy(next) {
        busy = next;
        urlInput.disabled = next;
        formatButtons.forEach((b) => (b.disabled = next));
        submit.disabled = next || !urlInput.value.trim();
        submit.textContent = next ? "..." : "CONVERTIR";
        progress.classList.toggle("hidden", !next);
      }

      function showError(code) {
        status.dataset.kind = "error";
        status.textContent = ERRORS[code] || "ERREUR";
        retry.classList.remove("hidden");
      }

      function reset() {
        urlInput.value = "";
        format = "wav";
        formatButtons.forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.format === "wav"))
        );
        status.dataset.kind = "info";
        status.textContent = "";
        retry.classList.add("hidden");
        setBusy(false);
        urlInput.focus();
      }

      formatButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          format = btn.dataset.format;
          formatButtons.forEach((b) =>
            b.setAttribute("aria-pressed", String(b === btn))
          );
        });
      });

      urlInput.addEventListener("input", () => {
        submit.disabled = busy || !urlInput.value.trim();
        if (status.dataset.kind === "error") {
          status.dataset.kind = "info";
          status.textContent = "";
          retry.classList.add("hidden");
        }
      });

      retry.addEventListener("click", reset);

      // Pull the server-proposed filename out of Content-Disposition.
      function filenameFrom(res) {
        const cd = res.headers.get("Content-Disposition") || "";
        const star = /filename\*=UTF-8''([^;]+)/i.exec(cd);
        if (star) return decodeURIComponent(star[1]);
        const plain = /filename="?([^";]+)"?/i.exec(cd);
        if (plain) return plain[1];
        return "audio." + format;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (busy) return;

        const url = urlInput.value.trim();
        if (!URL_RE.test(url)) {
          showError("invalid_url");
          return;
        }

        setBusy(true);
        status.dataset.kind = "info";
        status.textContent = "EXTRACTION EN COURS…";
        retry.classList.add("hidden");

        try {
          const res = await fetch("/api/convert", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url, format }),
          });

          if (!res.ok) {
            let code = "convert_failed";
            try {
              const data = await res.json();
              if (typeof data.error === "string") code = data.error;
            } catch {
              /* non-JSON error body */
            }
            setBusy(false);
            showError(code);
            return;
          }

          // Trigger the download automatically, then go straight back to blank.
          const blob = await res.blob();
          const name = filenameFrom(res);
          const objectUrl = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = objectUrl;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(objectUrl);

          reset();
        } catch (err) {
          console.error("convert request failed", err);
          setBusy(false);
          showError("network");
        }
      });

      urlInput.focus();
    </script>
  </body>
</html>
